[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neologism-embedding-learning"
version = "0.1.0"
description = "Experiments in learning behavioral concepts as single token embeddings in frozen language models."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.3,<3",
  "transformers>=4.46,<6",
  "accelerate>=0.34,<2",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

